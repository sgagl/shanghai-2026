* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {

}

.topbar {

.card {

  box-shadow: var(--shadow); padding: 16px;
}
.grid { display: grid; gap: 14px; }

.grid-3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }

/* trip cards */
.trip-card { position: relative; overflow: hidden; text-decoration: none; color: inherit; display: block; }
.trip-card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--trip, var(--accent)); }
.trip-card:hover { border-color: var(--trip, var(--accent)); }
.trip-card .count { font-size: 34px; font-weight: 700; letter-spacing: -.03em; color: var(--trip, var(--accent)); }
.trip-card .row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.meter { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 4px; }
.meter > span { display: block; height: 100%; background: var(--trip, var(--accent)); border-radius: 99px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
.stat .label { font-size: 12px; color: var(--muted); }
.stat .value { font-weight: 600; }
.next { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14px; }

/* pills */
.pill {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 99px;
  font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--neutral-bg); color: var(--muted);
}
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.info { background: var(--info-bg); color: var(--info); }
.pill.trip { background: color-mix(in srgb, var(--trip) 15%, transparent); color: var(--trip); }
a.pill { text-decoration: none; }
select.pill { border: 0; cursor: pointer; appearance: none; padding-right: 9px; }

/* deadlines */
.dl-group + .dl-group { margin-top: 18px; }
.dl-group h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
.dl {
  display: grid; grid-template-columns: 44px 108px 1fr auto; gap: 10px; align-items: center;
  padding: 8px 0; border-bottom: 1px solid var(--line);
}
.dl:last-child { border-bottom: 0; }
.dl.done .dl-title { text-decoration: line-through; color: var(--muted); }
.dl-when { font-variant-numeric: tabular-nums; font-size: 13px; }
.dl-when b { display: block; font-size: 14px; }
.dl-when.overdue b { color: var(--bad); }
.dl-meta { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.check { width: 44px; height: 44px; display: grid; place-items: center; margin: -6px 0; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--trip, var(--accent)); cursor: pointer; }
input[type="date"], input[type="datetime-local"], input[type="text"], input[type="number"], select.input {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 8px; min-height: 36px; max-width: 100%;
}
.dl input[type="date"] { width: 100%; font-size: 13px; }
@media (max-width: 640px) {
  .dl { grid-template-columns: 44px 1fr; }
  .dl-when { grid-column: 2; }
  .dl-title { grid-column: 2; }
  .dl-meta { grid-column: 2; justify-content: flex-start; }

  margin: 12px -16px 0; padding: 8px 16px; background: var(--bg); border-bottom: 1px solid var(--line);

  white-space: nowrap; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px;

.toggle input { width: 20px; height: 20px; accent-color: var(--trip); }

/* Trips app: reads/writes <trip folder>/trip.json through framework/server.py. No build step. */
"use strict";

// Static mode: a published, view-only snapshot with the data embedded as window.TRIPS_DATA (see framework/publish.py).
// Sandboxed: a claude.ai artifact frame (no map tiles, no #/path URLs); a standalone site (TRIPS_META.mode "site") has neither limit.
const S = { trips: [], byId: {}, saving: false, whatIf: {}, geo: {}, map: null, static: !!window.TRIPS_DATA, route: null };
S.sandboxed = S.static && (window.TRIPS_META || {}).mode !== "site";
const $ = (sel, el = document) => el.querySelector(sel);
const view = $("#view");

// ---------- helpers ----------
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const dayNum = (iso) => Date.UTC(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10)) / 864e5;
const daysUntil = (iso) => dayNum(iso.slice(0, 10)) - dayNum(todayISO());
const parseDue = (v) => (v ? new Date(v.includes("T") ? v : v + "T23:59") : null);
const fmtDate = (iso, o = { weekday: "short", day: "numeric", month: "short" }) =>
  iso ? new Date(iso.slice(0, 10) + "T12:00").toLocaleDateString("en-GB", o) : "";
const fmtTime = (iso) => (iso && iso.includes("T") ? iso.slice(11, 16) : "");
const eur = (n, d = 0) => (n == null ? "—" : "€" + n.toLocaleString("en-GB", { minimumFractionDigits: d, maximumFractionDigits: d }));
const money = (amount, cur) => (amount == null ? "" : `${cur || ""} ${amount.toLocaleString("en-GB", { maximumFractionDigits: 2 })}`.trim());
const clone = (o) => JSON.parse(JSON.stringify(o));
const optionOn = (t, item) => !item.option || (t.options || []).some((o) => o.id === item.option && o.enabled !== false);
const travelers = (t) => S.whatIf[t.id] ?? (t.travelerCount || (t.travelers || []).length || 1);
const placeName = (t, id) => ((t.places || []).find((p) => p.id === id) || {}).name || id;
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

const CLS = {
  booking: { booked: "ok", pending: "warn", quote: "info", assumed: "warn", to_book: "bad", cancelled: "" },
  payment: { paid: "ok", due: "bad", at_property: "info", deposit: "warn", none: "", unknown: "warn" },
  budget: { booked: "ok", official: "ok", quote: "info", estimate: "warn", placeholder: "warn", to_estimate: "bad" },
  entry: { ok: "ok", required: "warn", check: "info" },
  check: { ok: "ok", flag: "bad", changed: "warn", failed: "warn", pending: "" },
  scheduled: { planned: "info", done: "ok", cancelled: "", failed: "bad" },
};
const LABEL = {
  to_book: "to book", at_property: "pay at property", to_estimate: "to estimate", booking_opens: "sale opens",
  per_person: "pp", group: "group", none: "not paid",
};
const lab = (s) => LABEL[s] || s;
const pill = (text, cls = "") => `<span class="pill ${cls}">${esc(text)}</span>`;
const CAT_ORDER = ["flight", "train", "car", "stay", "transfer", "equipment", "permit", "insurance", "other"];
const CAT_LABEL = { flight: "Flights", train: "Trains", car: "Cars", stay: "Stays", transfer: "Transfers", equipment: "Equipment", permit: "Permits", insurance: "Insurance", other: "Other" };
const ICON = { flight: "✈︎", train: "🚆", car: "🚙", transfer: "🚐", ferry: "⛴", walk: "🚶", stay: "🛏", user: "•" };

function toast(msg, ms = 3200) {
  const el = $("#toast");
  el.textContent = msg; el.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => (el.hidden = true), ms);
}

// ---------- derived data ----------
function activeBookings(t) {
  return (t.bookings || []).filter((b) => optionOn(t, b) && b.status !== "cancelled" && (!b.choice || b.selected));
}
function needsAction(t) {
  return activeBookings(t).filter((b) => ["pending", "assumed", "to_book", "quote"].includes(b.status) || ["due", "unknown"].includes((b.payment || {}).status));
}
function openDeadlines(t) {
  return (t.deadlines || []).filter((d) => d.status === "open" && optionOn(t, d));
}
function bucketize(rows) {
  const now = new Date(), soon = new Date(now.getTime() + 30 * 864e5);
  const b = { overdue: [], soon: [], later: [], undated: [] };
  for (const r of rows) {
    const due = parseDue(r.d.due);
    if (!due) b.undated.push(r);
    else if (due < now) b.overdue.push(r);
    else if (due <= soon) b.soon.push(r);
    else b.later.push(r);
  }
  const byDue = (x, y) => parseDue(x.d.due) - parseDue(y.d.due);
  b.overdue.sort(byDue); b.soon.sort(byDue); b.later.sort(byDue);
  return b;

function budgetLineOn(t, b) {
  return b.included !== false && optionOn(t, b) && (!b.choice || b.selected);

  let total = 0, core = 0, option = 0, missing = 0;
  for (const b of t.budget || []) {
    if (!budgetLineOn(t, b)) continue;
    if (b.eur == null) { missing++; continue; }
    const v = b.eur * (b.basis === "per_person" ? n : 1);
    total += v; if (b.option) option += v; else core += v;
  }
  return { total, pp: total / n, core, option, missing, n };
}
function todoStats(t) {
  const items = (t.todos || []).flatMap((g) => g.items).filter((i) => optionOn(t, i));
  return { done: items.filter((i) => i.done).length, total: items.length };
}
function countdown(t) {
  const until = daysUntil(t.start), left = daysUntil(t.end);
  if (until > 0) return { big: until, small: until === 1 ? "day to go" : "days to go" };
  if (left >= 0) return { big: `Day ${1 - until}`, small: `of ${dayNum(t.end) - dayNum(t.start) + 1}` };
  return { big: "✓", small: "done" };
}
function stayOn(t, date) {
  return activeBookings(t).find((b) => b.category === "stay" && b.start <= date && date < b.end);
}

// ---------- API ----------
async function loadAll() {
  const r = await fetch("/api/trips", { cache: "no-store" });
  if (!r.ok) throw new Error((await r.json()).error || r.statusText);
  setTrips(await r.json());
}
function setTrips(list) {
  S.trips = list;
  S.byId = Object.fromEntries(list.map((t) => [t.id, t]));
}
async function mutate(tripId, fn, okMsg) {
  if (S.static) { toast("View only: this is a shared snapshot."); render(); return; }
  const t = clone(S.byId[tripId]);
  fn(t);
  S.saving = true; $("#sync").textContent = "Saving…";
  try {
    const r = await fetch(`/api/trips/${encodeURIComponent(tripId)}`, {
      method: "PUT", headers: { "Content-Type": "application/json", "If-Match": t._etag }, body: JSON.stringify(t),
    });
    const body = await r.json();
    if (r.status === 409) { await loadAll(); toast("trip.json was changed elsewhere (agent?). Reloaded, please redo your change."); }
    else if (!r.ok) toast("Save failed: " + (body.error || r.status));
    else { S.byId[tripId] = body; S.trips = S.trips.map((x) => (x.id === tripId ? body : x)); if (okMsg) toast(okMsg); }
  } catch (e) { toast("Save failed: server not reachable"); }
  S.saving = false; $("#sync").textContent = "Saved";
  render();
}

// ---------- components ----------
function deadlineRow(t, d, { showTrip = false, editable = false } = {}) {
  const due = parseDue(d.due), done = d.status !== "open";
  const dleft = d.due ? daysUntil(d.due) : null;
  const when = d.due
    ? `<b>${esc(fmtDate(d.due))}${fmtTime(d.due) ? " " + fmtTime(d.due) : ""}</b><span class="muted">${dleft === 0 ? "today" : dleft > 0 ? `in ${plural(dleft, "day")}` : `${-dleft} d ago`}</span>`
    : `<b class="muted">No date</b>`;
  const dateCell = editable
    ? `<input type="date" value="${esc((d.due || "").slice(0, 10))}" data-action="dl-due" data-trip="${esc(t.id)}" data-id="${esc(d.id)}" aria-label="Due date">`
    : when;
  const booking = d.bookingId ? (t.bookings || []).find((b) => b.id === d.bookingId) : null;
  return `<div class="dl ${done ? "done" : ""}" style="--trip:${esc(t.accent)}">
    <label class="check"><input type="checkbox" ${done ? "checked" : ""} data-action="dl-done" data-trip="${esc(t.id)}" data-id="${esc(d.id)}" aria-label="Mark done"></label>
    <div class="dl-when ${due && due < new Date() && !done ? "overdue" : ""}">${dateCell}</div>
    <div class="dl-title">${esc(d.title)}${d.url ? ` <a href="${esc(d.url)}" target="_blank" rel="noopener">↗</a>` : ""}
      ${d.notes || booking ? `<div class="muted small">${esc(d.notes || "")}${booking && editable ? ` ${d.notes ? "· " : ""}${esc(booking.title)}` : ""}</div>` : ""}</div>
    <div class="dl-meta">${showTrip ? `<a class="pill trip" href="#/trip/${esc(t.id)}/deadlines">${esc(t.name)}</a>` : ""}
      ${pill(d.hard ? "hard" : "soft", d.hard ? "bad" : "")}${pill(lab(d.kind))}</div>
  </div>`;
}
function deadlineBuckets(rows, opts) {
  const b = bucketize(rows);
  const grp = (title, list) => (list.length ? `<div class="dl-group"><h3>${title} · ${list.length}</h3>${list.map((r) => deadlineRow(r.t, r.d, opts)).join("")}</div>` : "");
  const html = grp("Overdue", b.overdue) + grp("Next 30 days", b.soon) + grp("Later", b.later) + grp("No date yet", b.undated);
  return html || `<p class="empty">No open deadlines.</p>`;
}

function checkList(t, list, showTrip = false) {
  const rows = list.filter((c) => optionOn(t, c)).map((c) => {
    const last = c.last || {}, st = last.status || "pending";
    return `<li><div class="bk-head"><b>${esc(c.title)}</b><span class="bk-pills">${showTrip ? `<a class="pill trip" style="--trip:${esc(t.accent)}" href="#/trip/${esc(t.id)}">${esc(t.name)}</a>` : ""}${pill(st, CLS.check[st])}</span></div>
      <div class="small">${esc(last.value || last.note || "Not checked yet")}${last.value && last.note ? ` <span class="muted">· ${esc(last.note)}</span>` : ""}</div>
      <div class="muted small">Rule: ${esc(c.rule)} · checked ${esc(last.date ? fmtDate(last.date) : "never")}${c.browser ? " · needs browser" : ""}</div></li>`;
  });
  return rows.length ? `<ul class="list">${rows.join("")}</ul>` : `<p class="empty">No checks defined.</p>`;
}
function scheduledList(t, list, showTrip = false) {
  const rows = list.map((s) => `<li><div class="bk-head"><b>${esc(fmtDate(s.when))} ${fmtTime(s.when)}</b><span class="bk-pills">${showTrip ? `<a class="pill trip" style="--trip:${esc(t.accent)}" href="#/trip/${esc(t.id)}">${esc(t.name)}</a>` : ""}${pill(s.status, CLS.scheduled[s.status])}</span></div>
    <div>${esc(s.action)}</div><div class="muted small">Allowed: ${esc(s.allowed || "—")}${s.agreed ? ` · agreed ${esc(fmtDate(s.agreed))}` : ""}${s.result ? ` · ${esc(s.result)}` : ""}</div></li>`);
  return rows.length ? `<ul class="list">${rows.join("")}</ul>` : `<p class="empty">Nothing scheduled. Agree a one-off action with the agent (time + exactly what it may do).</p>`;
}

        <div style="text-align:right"><div class="count">${esc(c.big)}</div><div class="muted small">${esc(c.small)}</div></div></div>

        <div class="stat"><div class="label">To-do</div><div class="value">${td.done}/${td.total}</div><div class="meter"><span style="width:${td.total ? (100 * td.done) / td.total : 0}%"></span></div></div>
        <div class="stat"><div class="label">Budget pp</div><div class="value">${eur(bt.pp)}</div><div class="muted small">${bt.missing ? `${bt.missing} to estimate` : "complete"}</div></div>
      </div>
      <div class="next">${nx ? `<span class="muted">Next:</span> ${nx.d.due ? `<b>${esc(fmtDate(nx.d.due))}</b> · ` : ""}${esc(nx.d.title)}` : `<span class="muted">No open deadlines</span>`}

  }).join("");

  view.innerHTML = `
    <div class="section-head" style="margin-top:8px"><h1>All trips</h1><span class="muted">${plural(S.trips.length, "trip")}</span></div>
    <div class="grid grid-2">${cards}</div>
    <section class="section"><div class="section-head"><h2>Deadlines</h2><span class="muted">all trips · open only</span></div>

        ${(() => { const hits = S.trips.flatMap((t) => (t.checks || []).filter((c) => optionOn(t, c) && ["flag", "changed", "failed"].includes((c.last || {}).status)).map((c) => checkList(t, [c], true)));
          return hits.length ? hits.join("") : `<p class="empty">No flags. Last results are on each trip's Overview.</p>`; })()}</div>
      <div class="card"><div class="section-head"><h2>Scheduled actions</h2><span class="muted">one-off, agreed in advance</span></div>
        ${(() => { const planned = S.trips.flatMap((t) => (t.scheduled || []).filter((s) => s.status === "planned").map((s) => ({ t, s }))).sort((a, b) => (a.s.when < b.s.when ? -1 : 1));
          return planned.length ? planned.map(({ t, s }) => scheduledList(t, [s], true)).join("") : `<p class="empty">Nothing scheduled.</p>`; })()}</div>
    </section>

const TABS = [["overview", "Overview"], ["itinerary", "Itinerary"], ["bookings", "Bookings"], ["deadlines", "Deadlines"], ["budget", "Budget"], ["todo", "To-do"], ["docs", "Documents"]];

function renderTrip(t, tab) {
  document.title = `${t.name} · Trips`;
  const b = bucketize(openDeadlines(t).map((d) => ({ t, d })));
  const badges = { deadlines: b.overdue.length + b.soon.length, bookings: needsAction(t).length };
  const c = countdown(t);
  const body = { overview: tabOverview, itinerary: tabItinerary, bookings: tabBookings, deadlines: tabDeadlines, budget: tabBudget, todo: tabTodo, docs: tabDocs }[tab] || tabOverview;
  view.innerHTML = `<div style="--trip:${esc(t.accent)}">

    <nav class="tabs" aria-label="Trip sections">${TABS.map(([id, name]) => `<a class="tab" href="#/trip/${esc(t.id)}/${id}" ${id === tab ? 'aria-current="page"' : ""}>${name}${badges[id] ? `<span class="badge">${badges[id]}</span>` : ""}</a>`).join("")}</nav>

}

function dayEvents(t, date) {
  const ev = [];
  for (const b of activeBookings(t)) {
    for (const s of b.segments || []) {
      const icon = ICON[b.category] || "•", flag = b.status !== "booked" ? " " + pill(lab(b.status), CLS.booking[b.status]) : "";
      if (s.depart.slice(0, 10) === date) {
        const plus = s.arrive && s.arrive.slice(0, 10) !== date ? ` (+${dayNum(s.arrive.slice(0, 10)) - dayNum(date)})` : "";
        ev.push({ k: s.depart, html: `<span class="ico">${icon}</span><span><b>${esc(s.number)}</b> ${esc(placeName(t, s.from))} ${fmtTime(s.depart)} → ${esc(placeName(t, s.to))} ${fmtTime(s.arrive)}${plus}${flag}</span>` });
      } else if (s.arrive && s.arrive.slice(0, 10) === date) {
        ev.push({ k: s.arrive, html: `<span class="ico">${icon}</span><span>Arrive ${esc(placeName(t, s.to))} ${fmtTime(s.arrive)} <span class="muted">(${esc(s.number)})</span>${flag}</span>` });
      }
    }
    if (b.category === "stay") {
      const flag = b.status !== "booked" ? " " + pill(lab(b.status), CLS.booking[b.status]) : "";
      if (b.end === date) ev.push({ k: date + "T09", html: `<span class="ico">🛏</span><span>Check-out ${esc(b.title)}${b.checkOut ? ` <span class="muted">by ${esc(b.checkOut)}</span>` : ""}</span>` });
      if (b.start === date) ev.push({ k: date + "T15", html: `<span class="ico">🛏</span><span>Check-in ${esc(b.title)}${b.checkIn ? ` <span class="muted">${esc(b.checkIn)}</span>` : ""}${flag}</span>` });
    }
  }
  for (const r of t.routes || []) {
    if (r.date !== date || !optionOn(t, r) || r.mode === "flight" || r.mode === "train") continue;
    const km = r.km ? ` · ${r.km} km` : "", h = r.hours ? ` · ${r.hours} h` : "";
    const a = (t.places || []).find((p) => p.id === r.from), b = (t.places || []).find((p) => p.id === r.to);
    const gmaps = a && b ? ` <a class="small" href="https://www.google.com/maps/dir/?api=1&amp;origin=${a.lat},${a.lng}&amp;destination=${b.lat},${b.lng}&amp;travelmode=${r.mode === "walk" ? "walking" : "driving"}" target="_blank" rel="noopener">Map ↗</a>` : "";
    ev.push({ k: date + "T12", html: `<span class="ico">${ICON[r.mode] || "•"}</span><span>${esc(r.label || `${placeName(t, r.from)} → ${placeName(t, r.to)}`)}<span class="muted">${km}${h}</span>${gmaps}</span>` });
  }
  return ev.sort((a, b) => (a.k < b.k ? -1 : 1));
}

function tabItinerary(t) {
  const days = (t.days || []).filter((d) => optionOn(t, d));
  const list = days.map((d) => {
    const ev = dayEvents(t, d.date);

    const empty = !ev.length && !user ? `<div class="empty">No activities planned</div>` : "";
    return `<div class="day" data-day="${esc(d.date)}">
      <div class="day-date"><div class="dow">${esc(fmtDate(d.date, { weekday: "short" }))}</div><div class="dnum">${esc(fmtDate(d.date, { day: "numeric" }))}</div><div class="mon">${esc(fmtDate(d.date, { month: "short" }))}</div></div>

  }).join("");

function bookingCard(t, b) {

      <div class="bk-pills">${sel("bk-status", ["booked", "pending", "quote", "assumed", "to_book", "cancelled"], b.status, CLS.booking[b.status])}${sel("bk-pay", ["paid", "due", "at_property", "deposit", "none", "unknown"], pay.status || "unknown", CLS.payment[pay.status || "unknown"])}</div></div>
    ${b.choice ? `<label class="toggle"><input type="radio" name="choice-${esc(b.choice)}" ${b.selected ? "checked" : ""} data-action="choose" data-trip="${esc(t.id)}" data-choice="${esc(b.choice)}" data-booking="${esc(b.id)}"> <span class="small">Selected option for <b>${esc(b.choice)}</b></span></label>` : ""}
    <dl class="kv">${kv.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
    ${(b.segments || []).map((s) => `<div class="seg">${ICON[b.category] || ""} <b>${esc(s.number)}</b> ${esc(s.from)} ${esc(fmtDate(s.depart))} ${fmtTime(s.depart)} → ${esc(s.to)} ${fmtTime(s.arrive)} <span class="muted">${esc(s.carrier || "")}</span></div>`).join("")}
    ${b.notes ? `<div class="muted small">${esc(b.notes)}</div>` : ""}
    <div class="small">${b.url ? `<a href="${esc(b.url)}" target="_blank" rel="noopener">Website ↗</a> ` : ""}${(b.docs || []).map((f) => `<a href="${docHref(t, f)}" target="_blank">📄 ${esc(f.split("/").pop())}</a>`).join(" ")}</div>
  </div>`;
}
function tabBookings(t) {
  const list = (t.bookings || []).filter((b) => optionOn(t, b));
  return CAT_ORDER.map((cat) => {
    const items = list.filter((b) => b.category === cat);
    return items.length ? `<h2 class="cat-title">${CAT_LABEL[cat]} · ${items.length}</h2><div class="grid grid-2">${items.map((b) => bookingCard(t, b)).join("")}</div>` : "";
  }).join("") || `<p class="empty">No bookings yet.</p>`;
}

function tabDeadlines(t) {
  const all = (t.deadlines || []).filter((d) => optionOn(t, d));
  const done = all.filter((d) => d.status !== "open");
  return `<div class="card">${deadlineBuckets(all.filter((d) => d.status === "open").map((d) => ({ t, d })), { editable: true })}</div>
    <form class="card section add-row" style="flex-wrap:wrap" data-action="dl-add" data-trip="${esc(t.id)}">
      <input type="text" name="title" placeholder="New deadline…" required aria-label="Deadline title" style="flex:2 1 220px">
      <input type="date" name="due" aria-label="Due date">
      <label class="toggle small"><input type="checkbox" name="hard"> hard date</label>
      <button class="btn primary" type="submit">Add</button></form>
    ${done.length ? `<div class="card section"><h3 class="muted">Done · ${done.length}</h3>${done.map((d) => deadlineRow(t, d, { editable: true })).join("")}</div>` : ""}`;
}

function tabBudget(t) {
  const n = travelers(t), bt = budgetTotals(t, n);
  const groups = [...new Set((t.budget || []).map((b) => b.group || "Other"))];
  const rows = groups.map((g) => {
    const items = (t.budget || []).filter((b) => (b.group || "Other") === g);
    const sub = items.filter((b) => budgetLineOn(t, b) && b.eur != null).reduce((s, b) => s + b.eur * (b.basis === "per_person" ? n : 1), 0);
    return `<tr class="grp"><td colspan="4">${esc(g)}</td><td class="num">${eur(sub)}</td></tr>` + items.map((b) => {
      const on = budgetLineOn(t, b), optOff = !optionOn(t, b);
      const groupV = b.eur == null ? null : b.eur * (b.basis === "per_person" ? n : 1);
      const ctl = b.choice
        ? `<input type="radio" name="bchoice-${esc(b.choice)}" ${b.selected ? "checked" : ""} ${optOff ? "disabled" : ""} data-action="choose" data-trip="${esc(t.id)}" data-choice="${esc(b.choice)}" data-budget="${esc(b.id)}" aria-label="Select">`
        : `<input type="checkbox" ${b.included !== false ? "checked" : ""} ${optOff ? "disabled" : ""} data-action="bud-incl" data-trip="${esc(t.id)}" data-id="${esc(b.id)}" aria-label="Include">`;
      return `<tr class="${on ? "" : "off"}"><td><span class="check">${ctl}</span></td>
        <td class="lbl">${esc(b.label)}${b.option ? ` <span class="opt-tag">option</span>` : ""}${b.source ? `<div class="muted small">${esc(b.source)}</div>` : ""}</td>
        <td>${pill(lab(b.status), CLS.budget[b.status])}</td>
        <td class="num">${b.eur == null ? "—" : eur(b.basis === "per_person" ? b.eur : b.eur / n)}<div class="muted small">${lab(b.basis)}</div></td>
        <td class="num">${eur(groupV)}</td></tr>`;
    }).join("");
  }).join("");
  return `<div class="totals">
      <div class="fact"><div class="label">Group total</div><div class="value">${eur(bt.total)}</div></div>
      <div class="fact"><div class="label">Per person</div><div class="value">${eur(bt.pp)}</div></div>
      ${(t.options || []).length ? `<div class="fact"><div class="label">Main trip · option</div><div class="value">${eur(bt.core)} · ${eur(bt.option)}</div></div>` : ""}
      <div class="fact"><div class="label">To estimate</div><div class="value">${bt.missing}</div></div>
      <div class="fact"><div class="label">Travellers (what-if)</div><div class="value stepper"><button type="button" data-action="n" data-trip="${esc(t.id)}" data-d="-1" aria-label="Fewer">−</button><span>${n}</span><button type="button" data-action="n" data-trip="${esc(t.id)}" data-d="1" aria-label="More">+</button></div></div>
    </div>
    <div class="card table-wrap"><table><thead><tr><th></th><th>Item</th><th>Status</th><th class="num">Per person</th><th class="num">Group</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${t.rates ? `<p class="muted small">Rates ${esc(t.rates.date)}: ${esc(t.rates.source || "")}</p>` : ""}`;
}

function tabTodo(t) {
  const st = todoStats(t);
  return `<div class="fact" style="margin-bottom:14px"><div class="label">Progress</div><div class="value">${st.done} of ${st.total}</div><div class="meter"><span style="width:${st.total ? (100 * st.done) / st.total : 0}%"></span></div></div>
    <div class="grid grid-2">${(t.todos || []).map((g, gi) => {
      const items = g.items.filter((i) => optionOn(t, i));
      return `<details class="card todo-group" open><summary>${esc(g.group)} <span class="muted small">${items.filter((i) => i.done).length}/${items.length}</span></summary>
        ${items.map((i) => `<div class="todo ${i.done ? "done" : ""}"><span class="check"><input type="checkbox" id="td-${esc(i.id)}" ${i.done ? "checked" : ""} data-action="todo" data-trip="${esc(t.id)}" data-id="${esc(i.id)}"></span><label for="td-${esc(i.id)}">${esc(i.text)} ${i.option ? `<span class="opt-tag">option</span>` : ""}</label>${i.url ? `<a href="${esc(i.url)}" target="_blank" rel="noopener" aria-label="Open site">↗</a>` : ""}</div>`).join("")}
        <form class="add-row" data-action="todo-add" data-trip="${esc(t.id)}" data-g="${gi}"><input type="text" name="text" placeholder="Add item…" aria-label="Add to-do"><button class="btn" type="submit">Add</button></form></details>`;
    }).join("")}</div>`;
}

const docHref = (t, f) => `${S.static ? "" : "/"}${[t._folder, ...f.split("/")].map(encodeURIComponent).join("/")}`;
function tabDocs(t) {
  return `<div class="card"><ul class="list">${(t.documents || []).map((d) => {
    const b = d.bookingId ? (t.bookings || []).find((x) => x.id === d.bookingId) : null;
    return `<li><a href="${docHref(t, d.file)}" target="_blank">📄 ${esc(d.title)}</a><div class="muted small">${esc(d.file)}${b ? ` · ${esc(b.title)}` : ""}</div></li>`;
  }).join("") || `<li class="empty">No documents</li>`}</ul></div>
  <p class="muted small" ${S.static ? "hidden" : ""}>Files live in <code>${esc(t._folder)}/</code>. Drop new PDFs or screenshots in <code>Documenti_originali/</code> and ask the trip agent to import them.</p>`;
}

// ---------- map ----------
function decodePolyline(str) {
  let i = 0, lat = 0, lng = 0; const out = [];
  while (i < str.length) {
    for (const k of [0, 1]) {
      let shift = 0, result = 0, b;
      do { b = str.charCodeAt(i++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
      const d = result & 1 ? ~(result >> 1) : result >> 1;
      if (k === 0) lat += d; else lng += d;
    }
    out.push([lat / 1e5, lng / 1e5]);
  }
  return out;
}
async function geometry(t) {
  if (t._geometry) return t._geometry;
  if (!t.geometryFile) return {};
  if (!S.geo[t.id]) {
    try { S.geo[t.id] = (await (await fetch(`/${encodeURIComponent(t._folder)}/${t.geometryFile}`)).json()).legs || {}; }
    catch (e) { S.geo[t.id] = {}; }
  }
  return S.geo[t.id];
}
async function drawMap(t) {
  const el = $("#leafmap");
  if (!el) return;
  if (!window.L) { el.innerHTML = `<p class="pad muted">Map unavailable offline.</p>`; return; }
  const geo = await geometry(t);
  if (!document.body.contains(el)) return;
  const map = (S.map = L.map(el, { scrollWheelZoom: false }));
  // Hosted snapshots can't load map tiles, so they draw routes and labelled stops on a plain background.
  if (!S.sandboxed) L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18, attribution: "© OpenStreetMap" }).addTo(map);
  const labelAll = (t.places || []).length < 6;
  const P = Object.fromEntries((t.places || []).filter((p) => optionOn(t, p)).map((p) => [p.id, p]));
  const accent = t.accent || "#2f5d62";
  const byDate = {}, main = [], all = [];
  for (const r of (t.routes || []).filter((r) => optionOn(t, r) && P[r.from] && P[r.to])) {
    const pts = r.osrm && geo[r.osrm] ? decodePolyline(geo[r.osrm].p) : [[P[r.from].lat, P[r.from].lng], [P[r.to].lat, P[r.to].lng]];
    const style = { flight: { dashArray: "6 8", weight: 2, opacity: 0.7 }, train: { dashArray: "2 6", weight: 3 }, car: { weight: 4 } }[r.mode] || { weight: 3, opacity: 0.8 };
    const line = L.polyline(pts, { color: r.option ? "#2e7d4f" : accent, ...style }).addTo(map)
      .bindTooltip(`${fmtDate(r.date)} · ${r.label || ""}${r.km ? ` · ${r.km} km` : ""}`);
    line.on("click", () => map.fitBounds(line.getBounds(), { padding: [30, 30] }));
    (byDate[r.date] = byDate[r.date] || []).push(...pts);
    all.push(...pts); if (r.mode !== "flight") main.push(...pts);
  }
  for (const p of Object.values(P)) {
    L.circleMarker([p.lat, p.lng], { radius: p.kind === "airport" ? 4 : 7, color: "#fff", weight: 2, fillColor: p.option ? "#2e7d4f" : accent, fillOpacity: 1 })
      .addTo(map).bindTooltip(p.name, { permanent: S.sandboxed && (labelAll || p.kind !== "airport"), direction: "right", offset: [6, 0] });
    all.push([p.lat, p.lng]); if (p.kind !== "airport") main.push([p.lat, p.lng]);
  }
  const fit = (pts, maxZoom = 12) => pts.length && map.fitBounds(L.latLngBounds(pts), { padding: [30, 30], maxZoom });
  S.fitMap = (scope, date) => {
    if (scope === "day") {
      const stay = stayOn(t, date), pts = [...(byDate[date] || [])];
      if (stay && P[stay.placeId]) pts.push([P[stay.placeId].lat, P[stay.placeId].lng]);
      return fit(pts.length ? pts : main);
    }
    fit(scope === "all" ? all : main.length ? main : all, scope === "all" ? 6 : 12);
  };
  S.fitMap("main");
}

// ---------- events ----------
function findTodo(t, id) { for (const g of t.todos || []) for (const i of g.items) if (i.id === id) return i; }
const uid = (p) => `${p}-${Date.now().toString(36)}`;

view.addEventListener("change", (e) => {
  const el = e.target, a = el.dataset.action, tid = el.dataset.trip, id = el.dataset.id;
  if (!a || !tid) return;
  if (a === "dl-done") mutate(tid, (t) => { const d = t.deadlines.find((x) => x.id === id); d.status = el.checked ? "done" : "open"; });
  else if (a === "dl-due") mutate(tid, (t) => {
    const d = t.deadlines.find((x) => x.id === id), time = d.due && d.due.includes("T") && d.due.slice(0, 10) === el.value ? d.due.slice(10) : "";
    d.due = el.value ? el.value + time : null;
  });
  else if (a === "bk-status") mutate(tid, (t) => { t.bookings.find((x) => x.id === id).status = el.value; });
  else if (a === "bk-pay") mutate(tid, (t) => { const b = t.bookings.find((x) => x.id === id); b.payment = { ...(b.payment || {}), status: el.value }; });
  else if (a === "choose") mutate(tid, (t) => {
    const ch = el.dataset.choice;
    const bookingId = el.dataset.booking || ((t.budget || []).find((b) => b.id === el.dataset.budget) || {}).bookingId;
    const budgetId = el.dataset.budget || ((t.budget || []).find((b) => b.bookingId === bookingId && b.choice === ch) || {}).id;
    for (const b of t.bookings || []) if (b.choice === ch) b.selected = b.id === bookingId;
    for (const b of t.budget || []) if (b.choice === ch) b.selected = b.id === budgetId;
  });
  else if (a === "bud-incl") mutate(tid, (t) => { t.budget.find((x) => x.id === id).included = el.checked; });
  else if (a === "opt-toggle") mutate(tid, (t) => { t.options.find((x) => x.id === id).enabled = el.checked; });
  else if (a === "todo") mutate(tid, (t) => { findTodo(t, id).done = el.checked; });
  else if (a === "q-toggle") mutate(tid, (t) => { t.openQuestions.find((x) => x.id === id).status = el.checked ? "resolved" : "open"; });
});

view.addEventListener("submit", (e) => {
  const f = e.target, a = f.dataset.action, tid = f.dataset.trip;
  if (!a) return;
  e.preventDefault();
  const data = new FormData(f), text = (data.get("text") || data.get("title") || "").trim();
  if (!text) return;
  if (a === "day-add") mutate(tid, (t) => { t.days.find((d) => d.date === f.dataset.date).items.push({ text }); });
  else if (a === "todo-add") mutate(tid, (t) => { t.todos[+f.dataset.g].items.push({ id: uid("t"), text, done: false }); });
  else if (a === "dl-add") mutate(tid, (t) => { (t.deadlines = t.deadlines || []).push({ id: uid("dl"), title: text, due: data.get("due") || null, hard: !!data.get("hard"), kind: "other", status: "open" }); }, "Deadline added");
});

view.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action], .day");
  if (!el) return;
  const a = el.dataset.action;
  if (a === "day-del") { e.stopPropagation(); mutate(el.dataset.trip, (t) => { t.days.find((d) => d.date === el.dataset.date).items.splice(+el.dataset.i, 1); }); }
  else if (a === "n") { const t = S.byId[el.dataset.trip]; S.whatIf[t.id] = Math.max(1, travelers(t) + +el.dataset.d); render(); }
  else if (a === "map-fit") S.fitMap && S.fitMap(el.dataset.scope);
  else if (el.classList.contains("day") && !e.target.closest("form, button, a, input")) {
    document.querySelectorAll(".day.active").forEach((d) => d.classList.remove("active"));
    el.classList.add("active");
    if (S.fitMap) { S.fitMap("day", el.dataset.day); if (innerWidth <= 860) $("#leafmap").scrollIntoView({ behavior: "smooth", block: "center" }); }
  }
});

// ---------- router ----------
const MUTATING = new Set(["dl-done", "dl-due", "bk-status", "bk-pay", "choose", "bud-incl", "opt-toggle", "todo", "q-toggle", "day-del"]);
const currentRoute = () => S.route || location.hash || (S.trips.length === 1 ? `#/trip/${S.trips[0].id}` : "#/");

function render() {
  if (S.map) { S.map.remove(); S.map = null; S.fitMap = null; }
  const route = currentRoute();
  const [, page, id, tab] = route.split("/");
  const scrollY = window.scrollY;
  if (page === "trip" && S.byId[id]) renderTrip(S.byId[id], tab || "overview");
  else renderHome();
  if (S.static) view.querySelectorAll("[data-action]").forEach((el) => { if (MUTATING.has(el.dataset.action)) el.disabled = true; });
  if (render.lastRoute === route) window.scrollTo(0, scrollY);
  else window.scrollTo(0, 0);
  render.lastRoute = route;
}
window.addEventListener("hashchange", () => { S.route = null; render(); });
// Hosted snapshots can't use #/path URLs, so in-page links switch views in memory.
document.addEventListener("click", (e) => {
  const a = S.sandboxed && e.target.closest('a[href^="#/"]');
  if (!a) return;
  e.preventDefault();
  S.route = a.getAttribute("href");
  render();
});

// Pick up edits made by the agent (or by hand) to trip.json files.
async function poll() {
  if (document.hidden || S.saving) return;
  const a = document.activeElement;
  if (a && a.tagName === "INPUT" && a.type === "text" && a.value) return;
  try {
    const r = await fetch("/api/trips", { cache: "no-store" });
    const list = await r.json();
    const changed = list.length !== S.trips.length || list.some((t) => (S.byId[t.id] || {})._etag !== t._etag);
    if (changed) { setTrips(list); S.geo = {}; render(); toast("Updated from disk"); }
    $("#sync").textContent = "Synced " + new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  } catch (e) { $("#sync").textContent = "Offline"; }
}

$("#theme-btn").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("trips-theme", document.documentElement.dataset.theme); } catch (e) {}
});
$("#today").textContent = fmtDate(todayISO(), { weekday: "short", day: "numeric", month: "short", year: "numeric" });

if (S.static) {
  document.documentElement.classList.add("static");
  setTrips(window.TRIPS_DATA);
  const meta = window.TRIPS_META || {};
  $("#sync").textContent = `View only · updated ${meta.published ? fmtDate(meta.published, { day: "numeric", month: "short" }) : ""}`;
  render();
} else {
  loadAll().then(render).catch((e) => {
    view.innerHTML = `<div class="card pad"><h2>Can't load trips</h2><p>${esc(e.message)}</p><p class="muted">Start the server: <code>python3 framework/server.py</code> and open <code>http://127.0.0.1:8765/app/</code>.</p></div>`;
  });
  setInterval(poll, 15000);
  document.addEventListener("visibilitychange", poll);
}

</script>
